[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changefence"
version = "2026.8.9"
description = "AI-agent security from change impact to runtime evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karteek Ponnuru"}]
keywords = ["ai-security", "agents", "agentic-ai", "security-change-impact", "capability-diff", "runtime-security", "ai-governance", "ci-cd"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
web = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
dev = ["pytest>=8.0", "fastapi>=0.116,<1", "httpx>=0.28,<1"]

[project.scripts]
changefence = "changefence.cli:main"

[tool.setuptools.packages.find]
include = ["changefence*"]
exclude = ["playground*", "docs*", "tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
