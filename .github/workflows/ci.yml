name: Test ChangeFence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest

      - name: Verify unsafe Impact example is blocked
        shell: bash
        run: |
          set +e
          changefence impact examples/procurement-base.yaml examples/procurement-candidate.yaml
          code=$?
          set -e
          test "$code" -eq 1

      - name: Verify safe Impact example passes
        run: changefence impact examples/procurement-base.yaml examples/procurement-safe-candidate.yaml

      - name: Verify Runtime review routing
        shell: bash
        run: |
          set +e
          changefence runtime examples/procurement-review.yaml procurement supplier.bank_account.write
          code=$?
          set -e
          test "$code" -eq 3

      - name: Verify Runtime invariant block
        shell: bash
        run: |
          set +e
          changefence runtime examples/procurement-candidate.yaml procurement payment.execute --executor finance
          code=$?
          set -e
          test "$code" -eq 1

      - name: Verify Policy plan generation
        run: changefence policy examples/procurement-base.yaml examples/procurement-candidate.yaml --json

      - name: Verify published demo data matches the engine
        run: python scripts/generate_demo_results.py --check

      - name: Verify lower-level compare remains backward compatible
        shell: bash
        run: |
          set +e
          changefence compare examples/procurement-base.yaml examples/procurement-candidate.yaml
          code=$?
          set -e
          test "$code" -eq 1
