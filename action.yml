name: ChangeFence Impact

description: Analyze AI-agent changes against security-owned policy and block newly introduced forbidden authority.
author: Karteek Ponnuru

inputs:
  baseline:
    description: Path to the approved baseline ChangeFence agent spec
    required: true
  candidate:
    description: Path to the candidate ChangeFence agent spec
    required: true
  policy:
    description: Optional path to the security-owned ChangeFence policy registry. When set, this is the authoritative source of invariants and review rules.
    required: false
    default: ""
  fail-on:
    description: Minimum invariant severity that blocks the build
    required: false
    default: high

runs:
  using: composite
  steps:
    - name: Install ChangeFence
      shell: bash
      run: python3 -m pip install "$GITHUB_ACTION_PATH"
    - name: Analyze agent security change impact
      shell: bash
      run: |
        POLICY_ARGS=()
        if [[ -n "${{ inputs.policy }}" ]]; then
          POLICY_ARGS=(--policy "${{ inputs.policy }}")
        fi
        changefence impact \
          "${{ inputs.baseline }}" \
          "${{ inputs.candidate }}" \
          "${POLICY_ARGS[@]}" \
          --fail-on "${{ inputs.fail-on }}"

branding:
  icon: shield
  color: blue
