name: ChangeFence Agent Security Gate
description: Detect new AI agent authority that violates security invariants.
author: Karteek Ponnuru
inputs:
  baseline:
    description: Path to the baseline ChangeFence agent spec
    required: true
  candidate:
    description: Path to the candidate ChangeFence agent spec
    required: true
  fail-on:
    description: Minimum invariant severity that blocks the build
    required: false
    default: high
runs:
  using: composite
  steps:
    - name: Install ChangeFence
      shell: bash
      run: python3 -m pip install "$GITHUB_ACTION_PATH"
    - name: Run agent security change gate
      shell: bash
      run: changefence compare "${{ inputs.baseline }}" "${{ inputs.candidate }}" --fail-on "${{ inputs.fail-on }}"
branding:
  icon: shield
  color: blue
