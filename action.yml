name: ChangeFence Agent Security Impact

description: Translate AI-agent release changes into security capability consequences.
author: Karteek Ponnuru

inputs:
  baseline:
    description: Path to the approved baseline ChangeFence agent spec
    required: true
  candidate:
    description: Path to the candidate ChangeFence agent spec
    required: true
  fail-on:
    description: Minimum invariant severity that blocks the build
    required: false
    default: high

runs:
  using: composite
  steps:
    - name: Install ChangeFence
      shell: bash
      run: python3 -m pip install "$GITHUB_ACTION_PATH"
    - name: Analyze agent security change impact
      shell: bash
      run: changefence impact "${{ inputs.baseline }}" "${{ inputs.candidate }}" --fail-on "${{ inputs.fail-on }}"

branding:
  icon: shield
  color: blue
